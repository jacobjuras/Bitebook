name: Pull Request CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test, and synthesize
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Type-check workspaces
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Check Expo project
        run: npm run doctor --workspace @bitebook/mobile

      - name: Export iOS production bundle
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/bitebook-ios"
        working-directory: apps/mobile

      - name: Export Android production bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/bitebook-android"
        working-directory: apps/mobile

      - name: Synthesize Beta and Production
        run: npm run synth --workspace @bitebook/infra
