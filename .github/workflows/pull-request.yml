name: Pull Request CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test, and synthesize
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Test pipeline change isolation guard
        run: npm run test:pipeline-isolation

      - name: Enforce pipeline change isolation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA...$HEAD_SHA" \
            | bash scripts/check-pipeline-change-isolation.sh

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Type-check workspaces
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Check Expo project
        run: npm run doctor --workspace @bitebook/mobile

      - name: Export iOS production bundle
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/bitebook-ios"
        working-directory: apps/mobile

      - name: Export Android production bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/bitebook-android"
        working-directory: apps/mobile

      - name: Synthesize infrastructure
        run: npm run synth --workspace @bitebook/infra

      - name: Verify pipeline structure snapshot
        run: npm run check:pipeline-structure
